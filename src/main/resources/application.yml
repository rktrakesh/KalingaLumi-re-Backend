spring:
  application:
    name: KalingaLumiere-Backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kalinga_lumiere_erp_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: KalingaLumiereHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  mail:
    host: ${MAIL_HOST:smtp.zoho.in}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tripathyrakesh002@zohomail.in}
    password: ${MAIL_PASSWORD:NMZLLuxadrb5}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

app:
  jwt:
    secret: ${JWT_SECRET:S2FsaW5nYUx1bWllcmVTdXBlclNlY3VyZUpXVFNlY3JldEtleTIwMjQ=}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:9999}
  timezone: Asia/Kolkata
  mail:
    from: ${MAIL_FROM:tripathyrakesh002@zohomail.in}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:9999/reset-password}

logging:
  level:
    com.business.erp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"