spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PROD_DB_MAX_POOL_SIZE}
      minimum-idle: ${PROD_DB_MIN_IDLE}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true

  mail:
    host: ${PROD_MAIL_HOST}
    port: ${PROD_MAIL_PORT}
    username: ${PROD_MAIL_USERNAME}
    password: ${PROD_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${PROD_MAIL_SMTP_AUTH}
          starttls:
            enable: ${PROD_MAIL_STARTTLS}

  servlet:
    multipart:
      max-file-size: ${PROD_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${PROD_MULTIPART_MAX_REQUEST_SIZE}

server:
  port: ${PROD_SERVER_PORT}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  storage:
    provider: ${PROD_STORAGE_PROVIDER}
    path: ${PROD_STORAGE_PATH}
  jwt:
    secret: ${PROD_JWT_SECRET}
    expiration: ${PROD_JWT_EXPIRATION}
    refresh-expiration: ${PROD_JWT_REFRESH_EXPIRATION}
  cors:
    allowed-origins: ${PROD_CORS_ORIGINS}
  security:
    trust-proxy-headers: ${PROD_TRUST_PROXY_HEADERS}
  mail:
    from: ${PROD_MAIL_FROM}
  frontend:
    reset-password-url: ${PROD_FRONTEND_RESET_PASSWORD_URL}

springdoc:
  api-docs:
    enabled: ${PROD_API_DOCS_ENABLED}
  swagger-ui:
    enabled: ${PROD_SWAGGER_UI_ENABLED}

logging:
  level:
    com.business.erp: ${PROD_APP_LOG_LEVEL}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
