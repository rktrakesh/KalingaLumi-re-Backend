spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/kalinga_lumiere_erp_test?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TEST_DB_MAX_POOL_SIZE:8}
      minimum-idle: ${TEST_DB_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${TEST_SHOW_SQL:false}

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true

  mail:
    host: ${TEST_MAIL_HOST:localhost}
    port: ${TEST_MAIL_PORT:1025}
    username: ${TEST_MAIL_USERNAME:}
    password: ${TEST_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${TEST_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${TEST_MAIL_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: ${TEST_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${TEST_MULTIPART_MAX_REQUEST_SIZE:6MB}

server:
  port: ${TEST_SERVER_PORT:9091}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

app:
  storage:
    provider: local
    path: ${TEST_STORAGE_PATH:target/test-uploads}
  jwt:
    secret: ${TEST_JWT_SECRET:dGVzdC1vbmx5LWthbGluZ2EtbHVtaWVyZS1qd3Qtc2VjcmV0LTIwMjY=}
    expiration: ${TEST_JWT_EXPIRATION:900000}
    refresh-expiration: ${TEST_JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${TEST_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    trust-proxy-headers: false
  mail:
    from: ${TEST_MAIL_FROM:no-reply@test.local}
  frontend:
    reset-password-url: ${TEST_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.business.erp: ${TEST_APP_LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ${TEST_HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.flywaydb: INFO
